<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация аккаунта</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>🛒 TechShop</h1>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main>
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Регистрация</h2>
        <form method="POST" class="checkout-form">
            <div class="form-group">
                <label for="username">Придумайте логин:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Придумайте пароль:</label>
                <input type="password" id="password" name="password" required>
                <small style="color: #666; display: block; margin-top: 5px;">
                    Минимум 6 символов, должен содержать и буквы, и цифры.
                </small>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
                <label for="confirm_password">Повторите пароль:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <button type="submit" class="btn" style="margin-top: 1.5rem; margin-bottom: 1rem;">Создать аккаунт</button>
            <p style="text-align: center; margin: 0;">Уже зарегистрированы? <a href="{{ url_for('login') }}" style="color: #3498db; font-weight: bold;">Войти</a></p>
        </form>
    </main>
</body>
</html>
